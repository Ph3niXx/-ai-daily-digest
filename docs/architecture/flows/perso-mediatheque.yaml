# Flow : Médiathèque anime (tracker AniList)
# STUB — voir pipelines.yaml::anime_tracker_sync.

id: perso-mediatheque
label: "Médiathèque anime (bibliothèque + sorties)"
domain: perso
status: todo

source_api:
  - name: "AniList GraphQL"
    detail: "graphql.anilist.co — recherche + Media(id_in) avec relations ; public sans clé ; walk franchise = contrat commun front/pipeline"

pipeline:
  id: anime_tracker_sync
  workflow: ".github/workflows/anime-tracker-sync.yml"
  script: "pipelines/anime_tracker_sync.py"
  cron: "30 7 * * *"

tables:
  - name: media_franchises
    write: true
  - name: media_entries
    write: true
  - name: media_releases
    write: true
  - name: media_progress
    write: false   # user-owned, front uniquement

panels:
  - id: mediatheque
    detail: "Panel Médiathèque — surfaces globales (bandeau Sorties, bande « Ce soir »), puis onglets de section Anime / Séries / Films / Manga (ADR-42 puis ADR-43, un onglet = un media_type ; la section Manga n'a NI agenda NI bandeau Sorties, faute de source de dates VF) portant chacun hero, rail « Continuer à regarder », agenda de la semaine et collection repliée (statuts dérivés) ; recherche transverse bibliothèque + AniList + TMDB, fiche franchise avec steppers"
  - id: mediatheque-pwa
    detail: "Page d'entree mobile dediee (mediatheque.html + boot-mediatheque.js) — meme panel, sans sidebar ni Tier 1 ; 2 scripts Babel au lieu de 30"
  - id: brief
    detail: "Encart MdtBriefCard (media_releases non acquittées < 7j, Tier 1)"
