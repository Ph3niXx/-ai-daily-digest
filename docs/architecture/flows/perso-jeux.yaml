# Flow : Tracker jeux video (IGDB + seed Steam)
# Voir pipelines.yaml::igdb_tracker_sync pour le detail du cron.

id: perso-jeux
label: "Tracker jeux (bibliotheque, licences suivies, sorties annoncees)"
domain: perso
status: active

source_api:
  - name: "IGDB v4"
    detail: "api.igdb.com/v4 — OAuth client_credentials Twitch ; collections, games, external_games (pont Steam), game_time_to_beats ; 4 req/s ; CORS refuse cote navigateur"
  - name: "steam_games_snapshot (interne)"
    detail: "inventaire PC deja alimente par steam_sync — sert de seed, pas de source de statut"

pipeline:
  id: igdb_tracker_sync
  workflow: ".github/workflows/igdb-tracker-sync.yml"
  script: "pipelines/igdb_tracker_sync.py"
  cron: "30 8 * * *"

tables:
  - name: game_franchises
    write: true
  - name: game_titles
    write: true
  - name: game_releases
    write: true
  - name: game_progress
    write: false   # user-owned, front uniquement
  - name: steam_games_snapshot
    write: false   # lecture seule (seed)

panels:
  - id: brief
    detail: "Encart GamesBriefCard (game_releases non acquittes < 30j, Tier 1) — seul point de contact du lot 1"
  - id: gaming
    detail: "Lot 2 implemente (bibliotheque a statuts, rail « A venir ») — plus conditionne a la sonde de survie depuis son lancement, cf. docs/specs/tab-gaming.md"

# Le pipeline n'est pas le seul producteur de game_releases depuis le
# 2026-08-14 (ADR-36) : suivre une licence depuis l'onglet Gaming (ajout d'un
# jeu console, ou case « m'avertir ») declenche un rattrapage immediat cote
# front, sans quoi le rail « A venir » reste vide jusqu'au cron du lendemain.
front_write_path:
  trigger: "cockpit/panel-gaming.jsx::syncFranchiseUpcoming() — ajout d'un jeu console ou activation du suivi d'une licence"
  proxy: "supabase/functions/igdb-proxy (mode ?collection=<id>) — verify_jwt, lecture seule cote IGDB, aucune ecriture en base"
  scope: "licences watched, rattachees a une collection IGDB, et jamais parcourues (bootstrapped_at null) — la ou le pipeline n'a encore rien a dire"
  writes: "game_titles (upsert on igdb_id) puis game_releases (upsert ignore-duplicates on title_id,event_type), avec le JWT de l'utilisateur, donc soumis a la RLS"
  never: "ne pose jamais bootstrapped_at — ce tampon signifie « collection parcourue en entier » et reste la propriete de la phase B"
