name: lint-claude-md

# Garde-fou anti-regonflage de CLAUDE.md.
#
# Contexte : CLAUDE.md a derive de 100 a 611 lignes entre la creation du
# projet et le slim down du 2026-05-18 par accumulation incrementale
# (tables, secrets, events telemetrie, arborescence).
#
# Le plafond de 200 lignes est la cible officielle Anthropic ("target under
# 200 lines per CLAUDE.md file", code.claude.com/docs/en/memory, verifie le
# 2026-08-31). Le rationale d'origine ("~14k tokens par tour", "cache 5min
# casse a chaque edition") etait faux : voir la docstring de
# scripts/lint_claude_md.py.
#
# Ce workflow lance scripts/lint_claude_md.py qui verifie :
#   - taille <= 200 lignes
#   - pas d'arborescence ASCII (├──, └──)
#   - pas de run de 5+ lignes type "- `xxx` — ..." (inventaire)
#   - pas de tableau "Secret" ou "event_type"
#   - presence d'une section "## Pointeurs ..." (regle DOUCE : warning seul)
#
# Phase 2 depuis le 2026-08-31 : BLOQUANT. La phase 1 warning-only devait
# durer 2-3 semaines ; elle a dure 15 semaines sans qu'aucune mesure ne soit
# faite. Deux bugs du script ont ete corriges au prealable (secret_table
# matchait les lignes de donnees et pas seulement les headers ; la regle
# pointeurs, documentee comme douce, etait implementee comme bloquante).

on:
  push:
    paths:
      - 'CLAUDE.md'
      - 'scripts/lint_claude_md.py'
      - '.github/workflows/lint-claude-md.yml'
  pull_request:
    paths:
      - 'CLAUDE.md'
      - 'scripts/lint_claude_md.py'
      - '.github/workflows/lint-claude-md.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: CLAUDE.md size + structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lint CLAUDE.md
        # Bloquant. Si cette etape fail :
        #   1. lis le warning et identifie la section incriminee
        #   2. deplace son contenu vers le fichier docs/ adequat (voir
        #      la suggestion emise par le script)
        #   3. garde dans CLAUDE.md une ligne "Sujet -> docs/x.md" dans
        #      la section "Pointeurs vers la doc longue"
        # Cf. CLAUDE.md preambule + memory feedback feedback_claude_md_slim.
        run: python scripts/lint_claude_md.py
