name: lint-claude-md

# Garde-fou anti-regonflage de CLAUDE.md.
#
# Contexte : CLAUDE.md a derive de 100 a 611 lignes entre la creation du
# projet et le slim down du 2026-05-18 par accumulation incrementale
# (tables, secrets, events telemetrie, arborescence). A 611 lignes,
# le cout etait de ~14k tokens recharges a chaque tour Claude, plus
# cache 5min casse a chaque edition.
#
# Ce workflow lance scripts/lint_claude_md.py qui verifie :
#   - taille <= 200 lignes
#   - pas d'arborescence ASCII (├──, └──)
#   - pas de run de 5+ lignes type "- `xxx` — ..." (inventaire)
#   - pas de tableau "Secret" ou "event_type"
#   - presence de la section "## Pointeurs vers la doc longue"
#
# Phase 1 (actuelle) : continue-on-error: true, warning-only. Permet
# de mesurer le bruit pendant ~2-3 semaines et de calibrer les regles
# sans bloquer le travail.
#
# Phase 2 (apres mesure) : retirer continue-on-error pour passer
# bloquant. Cf. progression de spec-drift-check / arch-drift-check
# qui suivent le meme pattern.

on:
  push:
    paths:
      - 'CLAUDE.md'
      - 'scripts/lint_claude_md.py'
      - '.github/workflows/lint-claude-md.yml'
  pull_request:
    paths:
      - 'CLAUDE.md'
      - 'scripts/lint_claude_md.py'
      - '.github/workflows/lint-claude-md.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: CLAUDE.md size + structure (warning only)
    runs-on: ubuntu-latest
    continue-on-error: true  # Phase 1 : warning-only, durcir apres 2-3 semaines
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lint CLAUDE.md
        # Si cette etape fail :
        #   1. lis le warning et identifie la section incriminee
        #   2. deplace son contenu vers le fichier docs/ adequat (voir
        #      la suggestion emise par le script)
        #   3. garde dans CLAUDE.md une ligne "Sujet -> docs/x.md" dans
        #      la section "Pointeurs vers la doc longue"
        # Cf. CLAUDE.md preambule + memory feedback feedback_claude_md_slim.
        run: python scripts/lint_claude_md.py
