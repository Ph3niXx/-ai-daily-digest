name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tests node
        run: |
          status=0
          for f in tests/test_*.mjs; do
            echo "── $f"
            node "$f" || status=1
          done
          exit $status
