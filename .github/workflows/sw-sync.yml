name: sw-sync
# Declenche sur push ET pull_request : 97 % des commits de ce depot arrivent
# en push direct sur main (6 merges sur 215), donc un filet limite aux PR ne
# s'est jamais declenche — 77 commits ont touche sw.js pour 3 auto-sync.
# sw.js n'est pas dans `paths`, le commit de retour ne se re-declenche donc pas.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "mediatheque.html"
      - "cockpit/**"
      - "manifest*.json"
      - "assets/**"
  pull_request:
    paths:
      - "index.html"
      - "mediatheque.html"
      - "cockpit/**"
      - "manifest*.json"
      - "assets/**"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync sw.js
        run: node scripts/sync-sw.mjs
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain sw.js)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sw.js
            git commit -m "chore(sw): auto-sync cache manifest"
            git push
          fi
